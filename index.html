<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>大鱼吃小鱼</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#031126}
#sea{position:fixed;inset:0;z-index:0;background:linear-gradient(180deg,#031126 0%,#074a72 42%,#0a7fa8 78%,#0fc5d9 100%)}
.bubble{position:absolute;bottom:-90px;border-radius:50%;pointer-events:none;background:radial-gradient(circle at 30% 28%,rgba(255,255,255,.88),rgba(145,225,255,.18) 44%,rgba(74,190,255,.06) 74%);box-shadow:inset 0 0 12px rgba(255,255,255,.34),0 0 8px rgba(150,230,255,.25);animation:rise linear infinite}
@keyframes rise{to{transform:translateY(-112vh)}}
#game{position:fixed;inset:0;z-index:1;display:block;pointer-events:none}
#hud{position:fixed;top:16px;left:16px;z-index:2;pointer-events:none;color:#eafcff;font:600 15px/1.4 "Segoe UI",sans-serif;letter-spacing:0;text-shadow:0 2px 8px rgba(0,20,40,.65)}
#over{position:fixed;inset:0;z-index:3;display:none;place-items:center;background:rgba(0,8,22,.55);backdrop-filter:blur(3px)}
#over.show{display:grid}
.panel{padding:26px 30px;border-radius:8px;background:rgba(0,28,52,.88);color:#fff;text-align:center;box-shadow:0 18px 60px rgba(0,0,0,.35)}
.panel h1{font-size:28px;margin-bottom:10px;letter-spacing:0}
.panel p{color:#bdefff;margin:8px 0 20px}
button{border:0;border-radius:8px;padding:10px 18px;cursor:pointer;color:#032338;font-weight:700;background:linear-gradient(135deg,#8be8ff,#36b6ff)}
button:hover{filter:brightness(1.08)}
</style>
</head>
<body>
<div id="sea"></div>
<canvas id="game"></canvas>
<div id="hud">体型 <span id="size">18</span> · 吞食 <span id="score">0</span></div>
<div id="over"><div class="panel"><h1>被大鱼吃掉了</h1><p>点击重新开始</p><button id="restart">重新开始</button></div></div>
<script>

const canvas=document.getElementById('game');
const ctx=canvas.getContext('2d');
const sea=document.getElementById('sea');
const sizeEl=document.getElementById('size');
const scoreEl=document.getElementById('score');
const overEl=document.getElementById('over');
const restartBtn=document.getElementById('restart');
const colors=['#ffd45a','#ff8a5c','#64e2ff','#5dd6a0','#e77fca','#8fb8ff'];
let W=0,H=0,running=true,score=0,last=performance.now();
let mouse={x:innerWidth/2,y:innerHeight*.65};
const player={x:innerWidth/2,y:innerHeight*.65,r:18,angle:0};
const fish=[];

function resize(){
  W=canvas.width=Math.floor(innerWidth*Math.min(devicePixelRatio||1,2));
  H=canvas.height=Math.floor(innerHeight*Math.min(devicePixelRatio||1,2));
  canvas.style.width=innerWidth+'px';
  canvas.style.height=innerHeight+'px';
  ctx.setTransform(Math.min(devicePixelRatio||1,2),0,0,Math.min(devicePixelRatio||1,2),0,0);
}

function addBubbles(){
  for(let i=0;i<18;i++){
    const b=document.createElement('span');
    const s=10+Math.random()*46;
    b.className='bubble';
    b.style.left=Math.random()*100+'%';
    b.style.width=s+'px';
    b.style.height=s+'px';
    b.style.animationDuration=7+Math.random()*12+'s';
    b.style.animationDelay=-Math.random()*18+'s';
    sea.appendChild(b);
  }
}

function makeFish(min=10,max=55){
  const r=min+Math.random()*(max-min);
  let x=Math.random()*innerWidth;
  let y=Math.random()*innerHeight;
  for(let i=0;i<30;i++){
    if(Math.hypot(x-player.x,y-player.y)>player.r+r+120)break;
    x=Math.random()*innerWidth;y=Math.random()*innerHeight;
  }
  return{x,y,r,angle:Math.random()*Math.PI*2,speed:.35+Math.random()*.8,turn:0,color:colors[Math.floor(Math.random()*colors.length)]};
}

function seed(){fish.length=0;for(let i=0;i<24;i++)fish.push(makeFish());}

function reset(){
  score=0;
  player.x=innerWidth/2;player.y=innerHeight*.65;
  player.r=18;player.angle=0;
  running=true;overEl.classList.remove('show');seed();updateHud();
}

function gameOver(){running=false;overEl.classList.add('show');}

function updateHud(){sizeEl.textContent=Math.round(player.r);scoreEl.textContent=score;}

function wrap(f){
  if(f.x<-60)f.x=innerWidth+50;
  if(f.x>innerWidth+60)f.x=-50;
  if(f.y<-60)f.y=innerHeight+50;
  if(f.y>innerHeight+60)f.y=-50;
}

function update(dt){
  if(!running)return;
  const nx=player.x+(mouse.x-player.x)*Math.min(1,dt*7);
  const ny=player.y+(mouse.y-player.y)*Math.min(1,dt*7);
  if(Math.hypot(nx-player.x,ny-player.y)>.01)player.angle=Math.atan2(ny-player.y,nx-player.x);
  player.x=nx;player.y=ny;
  for(let i=fish.length-1;i>=0;i--){
    const f=fish[i];f.turn-=dt;
    if(f.turn<=0){f.angle+=(Math.random()-.5)*Math.PI;f.turn=1.5+Math.random()*2.5;}
    f.angle+=Math.sin(performance.now()*.001+f.x*.01)*.002;
    f.x+=Math.cos(f.angle)*f.speed*60*dt;
    f.y+=Math.sin(f.angle)*f.speed*60*dt;
    wrap(f);
    const d=Math.hypot(f.x-player.x,f.y-player.y);
    if(d<(player.r+f.r)*.58){
      if(f.r<player.r){
        score++;
        player.r=Math.min(player.r+f.r*.08,96);
        fish.splice(i,1);
        const lo=Math.max(9,player.r*.55),hi=Math.min(120,player.r*1.5);
        fish.push(makeFish(lo,hi));
      } else {
        gameOver();return;
      }
    }
  }
  updateHud();
}

function drawFish(x,y,r,angle,color,hero=false){
  ctx.save();ctx.translate(x,y);ctx.rotate(angle);
  const g=ctx.createRadialGradient(0,-r*.18,r*.12,0,0,r);
  g.addColorStop(0,hero?'#fff7c2':'#fff');g.addColorStop(.32,color);g.addColorStop(1,hero?'#d99a28':color);
  ctx.beginPath();ctx.moveTo(-r*.55,0);ctx.lineTo(-r*.95,-r*.42);ctx.lineTo(-r*.95,r*.42);ctx.closePath();ctx.fillStyle=color;ctx.fill();
  ctx.beginPath();ctx.ellipse(0,0,r,r*.46,0,0,Math.PI*2);ctx.fillStyle=g;ctx.fill();
  ctx.beginPath();ctx.arc(r*.38,-r*.1,r*.13,0,Math.PI*2);ctx.fillStyle='#10243d';ctx.fill();
  ctx.beginPath();ctx.arc(r*.41,-r*.13,r*.045,0,Math.PI*2);ctx.fillStyle='#fff';ctx.fill();
  ctx.restore();
}

function render(){
  ctx.clearRect(0,0,innerWidth,innerHeight);
  fish.forEach(f=>drawFish(f.x,f.y,f.r,f.angle,f.color));
  drawFish(player.x,player.y,player.r,player.angle,'#ffd45a',true);
}

function frame(now){
  const dt=Math.min((now-last)/1000,.05);
  last=now;
  update(dt);
  render();
  requestAnimationFrame(frame);
}

addEventListener('resize',resize);
addEventListener('pointermove',e=>{
  mouse.x=e.clientX;
  mouse.y=e.clientY;
});
restartBtn.addEventListener('click',reset);

resize();
addBubbles();
seed();updateHud();requestAnimationFrame(frame);
</script>
</body>
</html>
